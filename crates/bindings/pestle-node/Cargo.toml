[package]
name = "pestle-node"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["mimalloc"]
# mimalloc as the global allocator, except on macOS (see src/lib.rs).
mimalloc = ["dep:mimalloc"]
# pest grammars: the Grammar class and `parse` fields.
grammar = ["dep:pestle-grammar", "pestle-html/grammar"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "2"
serde_json.workspace = true
serde = "1"
regex.workspace = true

pestle-grammar = { workspace = true, optional = true }
pestle-html.workspace = true

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
mimalloc = { workspace = true, optional = true }

[build-dependencies]
napi-build = "2"
