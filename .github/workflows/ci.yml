name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt-clippy:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: clippy
          components: rustfmt,clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy, with pest grammars
        run: cargo clippy -p pestle-html -p pestle-node --features pestle-html/grammar,pestle-node/grammar --all-targets --locked -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test-${{ matrix.os }}
      - run: cargo test --workspace --locked --exclude pestle-node
      - name: cargo test, with pest grammars
        run: cargo test -p pestle-html --features grammar --locked

  package:
    name: release readiness (versions, crate packaging, workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-node-yarn
      - run: node scripts/check-version.mjs
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: package
      - run: cargo package --workspace --exclude pestle-node --exclude pestle-bench --locked --no-verify
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
